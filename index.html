<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Whitehorse Daily Construction Report</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b6b72">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daily Report">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#eef2f2;--panel:#fff;--text:#1c2b2e;--mute:#5b6f73;--line:#cfdadb;--brand:#0b6b72;--brandtx:#fff;--warn:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a1b;--panel:#1b2627;--text:#e6eeee;--mute:#9db0b2;--line:#324244;--brand:#3fb3bb;--brandtx:#06191b;--warn:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121a1b;--panel:#1b2627;--text:#e6eeee;--mute:#9db0b2;--line:#324244;--brand:#3fb3bb;--brandtx:#06191b;--warn:#ff8a80;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 "Public Sans",Arial,Helvetica,sans-serif;display:grid;grid-template-columns:270px 1fr;min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:12px;max-height:100vh;position:sticky;top:0;overflow:auto}
aside img{width:150px;max-width:100%}
aside h2{font-size:15px;margin:4px 0 0}
button{font:inherit;cursor:pointer;border:1px solid var(--brand);background:transparent;color:var(--brand);border-radius:6px;padding:7px 12px;font-weight:600}
button.p{background:var(--brand);color:var(--brandtx)}
button.d{border-color:var(--warn);color:var(--warn)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.item{display:block;width:100%;text-align:left;border:1px solid var(--line);color:var(--text);font-weight:400;padding:8px 10px}
.item.on{border-color:var(--brand);box-shadow:inset 3px 0 0 var(--brand)}
.item small{display:block;color:var(--mute)}
.ok{color:var(--brand);font-weight:600}
.gh{display:flex;gap:6px;width:100%;text-align:left;border:0;color:var(--text);padding:8px 4px;min-height:40px;font-weight:700}.gh span{color:var(--mute);font-weight:400}.grp{margin-bottom:8px}.grp .item{margin-bottom:6px}
.cp{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:6px;padding:10px;font-size:13px}.cp[hidden]{display:none}.cp select{width:100%;margin-top:3px;font:inherit;padding:5px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:4px}.cp label{display:block}.cp small{color:var(--mute)}#to,#q{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--text)}#to{min-width:210px}#q{width:100%}
main{padding:16px;min-width:0}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;max-width:860px;margin:0 auto 12px}
.bar .sp{flex:1}
#st{color:var(--mute);font-size:13px}
.paper{background:#fff;color:#000;max-width:860px;margin:0 auto;padding:22px;font-family:Arial,Helvetica,sans-serif;font-size:13px;box-shadow:0 1px 6px rgba(0,0,0,.18)}
.hd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.hd img{width:120px}
.hd h1{font-size:16px;margin:6px 0 0}
.sec{border:1px solid #000;margin-bottom:14px;break-inside:avoid}
.sec>h3{margin:0;background:#d9d9d9;font-size:13px;padding:2px 6px;border-bottom:1px solid #000}
.r{display:grid;border-top:1px solid #000}
.r:first-of-type{border-top:0}
.r>div{padding:2px 6px;border-left:1px solid #000;min-width:0;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.r>div:first-child{border-left:0}
.c1{grid-template-columns:1fr}.c2{grid-template-columns:1fr 1fr}.c3{grid-template-columns:1fr 1fr 1fr}.c4{grid-template-columns:1fr 1fr 1fr 1fr}
.c2l{grid-template-columns:62% 38%}.ca{grid-template-columns:110px 1fr}.cq{grid-template-columns:1fr 1fr 1.2fr 1fr}
.hdr>div{font-weight:700;justify-content:center;background:#f2f2f2}
.paper input[type=text],.paper input[type=date],.paper input[type=time],.paper textarea{font:inherit;color:#000;background:transparent;border:0;border-bottom:1px dotted #999;width:100%;padding:2px;border-radius:0}
.paper input[type=text]:focus,.paper textarea:focus,.paper input[type=time]:focus,.paper input[type=date]:focus{background:#eaf6f7;outline:0}
.paper textarea{resize:none;overflow:hidden;min-height:34px;border:0}
.paper label{white-space:nowrap}
.paper input[type=radio]{accent-color:#0b6b72}
.fl{flex:1 1 140px}
.k{font-weight:700}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:8px}
.ph{break-inside:avoid;border:1px solid #bbb;padding:4px}
.ph img{width:100%;display:block}
.ph input{margin-top:4px}
.sig{border:1px solid #000;background:#fff;touch-action:none;width:100%;max-width:420px;height:140px;display:block}
.sg{display:grid;grid-template-columns:130px 1fr;gap:8px 10px;align-items:center;margin-top:8px;max-width:560px}
.mini{font-size:12px;padding:3px 8px;margin:6px 6px 6px 0}
.top,.cls,#scrim{display:none}
.paper .btnl{border:1px solid #0b6b72;color:#0b6b72;border-radius:6px;padding:10px 14px;font-weight:700;cursor:pointer;background:#fff;display:inline-block}
@media screen and (max-width:820px){
body{grid-template-columns:1fr;font-size:16px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--brand);z-index:50}
.top{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;align-items:center;gap:10px;background:var(--brand);color:var(--brandtx);padding:8px 12px}
.top img{height:34px;background:#fff;border-radius:4px;padding:2px}
.top b{flex:1;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top button{background:var(--brandtx);color:var(--brand);border-color:var(--brandtx)}
aside{position:fixed;inset:0 auto 0 0;z-index:40;max-height:none;width:min(88vw,340px);transform:translateX(-105%);transition:transform .2s;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));box-shadow:2px 0 14px rgba(0,0,0,.35);border-right:0}
body.nav aside{transform:none}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:35}
body.nav #scrim{display:block}
.cls{display:block}
main{padding:8px 0 calc(24px + env(safe-area-inset-bottom,0px))}
.bar{padding:0 10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bar .sp{display:none}
.bar #pdf{order:1}.bar #wd{order:2}.bar #em{order:3}.bar #dup{order:4}.bar #del{order:5}.bar #lk{order:6}.bar #to{order:7;grid-column:1/-1;min-width:0;width:100%}.bar #st{order:8;grid-column:1/-1;font-size:12px}
button{min-height:44px;white-space:normal}
.paper{padding:8px;box-shadow:none;font-size:15px}
.paper input[type=text],.paper input[type=date],.paper input[type=time],.paper textarea{font-size:16px;min-height:40px}
.paper input[type=radio]{width:22px;height:22px}
.paper label{padding:6px 10px 6px 0;display:inline-flex;align-items:center;gap:6px}
.paper .btnl{min-height:44px;display:inline-flex;align-items:center}
.c3,.c4,.c2,.c2l,.cq{grid-template-columns:1fr}
.ca{grid-template-columns:116px 1fr}
.r>div{border-left:0;border-top:1px solid #ccc}
.r>div:first-child{border-top:0}
.ca>div+div{border-top:0;border-left:1px solid #ccc}
.r.hdr.c3,.r.hdr.c4,.r.hdr.cq{display:none}
.pg{grid-template-columns:1fr}
.mini{min-height:40px;font-size:14px}
.sg{grid-template-columns:1fr}
.sig{height:170px;max-width:none}
.item{min-height:52px}
.cp select,#q,#to{font-size:16px;min-height:40px}
}
@media print{
@page{margin:12mm}
body{display:block;background:#fff}aside,.bar,.noprint,.top,#scrim{display:none!important}::placeholder{color:transparent}
main{padding:0}.paper{box-shadow:none;padding:0;max-width:none}
.paper input,.paper textarea{border-bottom:0!important}
.c3,.c4,.c2,.c2l,.cq{grid-template-columns:revert-layer}
.c2{grid-template-columns:1fr 1fr}.c3{grid-template-columns:1fr 1fr 1fr}.c4{grid-template-columns:1fr 1fr 1fr 1fr}.c2l{grid-template-columns:62% 38%}.cq{grid-template-columns:1fr 1fr 1.2fr 1fr}
.r>div{border-left:1px solid #000;border-top:0}.r>div:first-child{border-left:0}
.sec{break-inside:auto}.sec>h3,.r{break-inside:avoid}
}
#intro{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#12818a,#0a3a40 75%);color:#fff;transition:opacity .5s,visibility .5s}
#intro.out{opacity:0;visibility:hidden}
.iw{width:100%;text-align:center}
.im{margin:18px 0 0;font-size:clamp(20px,5vw,32px);font-weight:600;letter-spacing:.02em;opacity:0;animation:ifade .8s .4s forwards}
.im b{color:#f2c14e;font-weight:800;letter-spacing:.12em}
@keyframes ifade{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.im{animation:none;opacity:1}}
@media print{#intro{display:none!important}}
#lock{position:fixed;inset:0;z-index:250;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:16px}
#lock[hidden]{display:none}
#lf{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:22px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px;text-align:center}
#lf img{width:130px;align-self:center}#lf h2{margin:0;font-size:18px}
#lf input{font:inherit;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--text)}
#lm{margin:0;color:var(--mute);font-size:13px;min-height:1.2em}#lm.err{color:var(--warn)}
@media print{#lock{display:none!important}}
</style>
</head>

<script>
(function(){const el=document.getElementById('intro');if(!el)return;
  const W=innerWidth,R=46,HH=130,cy=70,cl=112,N=12,rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
  let links='',d='',sp='';
  for(let x=-10;x<W+30;x+=20)links+='<rect x="'+x+'" y="'+(cl-6)+'" width="26" height="12" rx="6" fill="none" stroke="#c9ccd0" stroke-width="3"/>';
  for(let i=0;i<N;i++){const a=i*2*Math.PI/N;[[a-.2,.84],[a-.11,1],[a+.11,1],[a+.2,.84]].forEach(([t,r],j)=>{d+=(i+j?'L':'M')+(Math.cos(t)*R*r).toFixed(1)+' '+(Math.sin(t)*R*r).toFixed(1)})}
  d+='Z';
  for(let i=0;i<6;i++){const a=i*Math.PI/3;sp+='<line x1="0" y1="0" x2="'+(Math.cos(a)*R*.62).toFixed(1)+'" y2="'+(Math.sin(a)*R*.62).toFixed(1)+'"/>'}
  document.getElementById('wsvg').innerHTML='<svg viewBox="0 0 '+W+' '+HH+'" width="100%" height="'+HH+'" style="display:block">'+links+'<g id="wh"><path d="'+d+'" fill="#f2c14e" stroke="#7a5a10" stroke-width="2"/><circle r="'+(R*.58)+'" fill="#0a3a40"/><g stroke="#f2c14e" stroke-width="5" stroke-linecap="round">'+sp+'</g><circle r="9" fill="#f2c14e" stroke="#7a5a10" stroke-width="2"/></g></svg>';
  const g=document.getElementById('wh'),t0=performance.now();
  function f(now){const p=Math.min(1,(now-t0)/5000),x=rm?W/2:-R*2+(W+R*4)*p;g.setAttribute('transform','translate('+x.toFixed(1)+' '+cy+') rotate('+(rm?0:x/R*57.3).toFixed(1)+')');if(p<1)requestAnimationFrame(f)}
  requestAnimationFrame(f);
  setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),600)},5000);
})();

const PATH='R:\\Development_Services\\Engineering\\Internal\\WATER & SEWER\\240c02021 - Hydrant Infill and Replacement\\07_Construction\\01_Photos';

const fromB64=t=>{const b=atob(t),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a};
async function derive(pw,salt){const m=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function persist(){const iv=crypto.getRandomValues(new Uint8Array(12)),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},vk,enc.encode(JSON.stringify(db)));
  localStorage.setItem(EK,JSON.stringify({v:1,s:salt64,i:toB64(iv),c:toB64(ct)}))}
const err=t=>{$('#lm').textContent=t;$('#lm').className='err'};
function lockInit(){
  $('#lg').src=LOGO;store=null;try{store=JSON.parse(localStorage.getItem(EK)||'null')}catch(e){}
  let legacy=null;try{legacy=localStorage.getItem(K)}catch(e){}
  const setup=!store;
  $('#lt').textContent=setup?'Create a passcode':'Unlock reports';
  $('#lm').className='';$('#lm').textContent=setup?'Choose at least 8 characters. Reports are encrypted with it on this device. If you forget it, the data cannot be recovered.'+(legacy?' Your existing reports will be encrypted.':''):'Enter your passcode to open the reports.';
  $('#p2').hidden=!setup;$('#lb').textContent=setup?'Create passcode':'Unlock';$('#lw').hidden=setup;$('#lw').textContent='Forgot passcode? Erase all data';eraseArm=false;
  $('#p1').value='';$('#p2').value='';$('#lock').hidden=false;if(!matchMedia('(max-width:820px)').matches)setTimeout(()=>$('#p1').focus(),50)}
function enter(){$('#lock').hidden=true;$('#p1').value='';$('#p2').value='';
  try{$('#to').value=localStorage.getItem(K+'-to')||''}catch(e){}
  if(!db.length)db.push(blank());cur=byDate()[0];render();renderList();arm()}
$('#lf').onsubmit=async e=>{e.preventDefault();if(Date.now()<hold)return;const pw=$('#p1').value;
  if(!store){
    if(pw.length<8){err('The passcode must be at least 8 characters.');return}
    if(pw!==$('#p2').value){err('The passcodes do not match.');return}
    try{const salt=crypto.getRandomValues(new Uint8Array(16));vk=await derive(pw,salt);salt64=toB64(salt);
      let old=[];try{old=JSON.parse(localStorage.getItem(K)||'[]')}catch(x){}
      db=Array.isArray(old)?old:[];await persist();try{localStorage.removeItem(K)}catch(x){}}
    catch(x){vk=null;err('Could not save to browser storage. Check that storage is allowed and try again.');return}
  }else{
    try{salt64=store.s;const k=await derive(pw,fromB64(store.s)),pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:fromB64(store.i)},k,fromB64(store.c));db=JSON.parse(dec.decode(pt));vk=k}
    catch(x){vk=null;fails++;const w=Math.min(30,fails*2);hold=Date.now()+w*1000;err('Wrong passcode. Please wait '+w+' seconds before trying again.');return}
  }
  fails=0;enter()};
$('#lw').onclick=()=>{if(!eraseArm){eraseArm=true;$('#lw').textContent='Click again to permanently erase all reports';return}
  try{localStorage.removeItem(EK);localStorage.removeItem(K)}catch(e){}db=[];lockInit()};
async function lockNow(){if(vk){clearTimeout(tm);try{await persist()}catch(e){}}
  vk=null;db=[];cur=null;clearTimeout(idleT);$('#form').innerHTML='';$('#list').innerHTML='';$('#ttl').textContent='Locked';document.body.classList.remove('nav');lockInit()}
function arm(){clearTimeout(idleT);idleT=setTimeout(()=>{if(vk)lockNow()},300000)}
['pointerdown','keydown','touchstart'].forEach(ev=>addEventListener(ev,()=>{if(vk)arm()},{passive:true}));
document.addEventListener('visibilitychange',()=>{if(document.hidden)hid=Date.now();else if(vk&&Date.now()-hid>120000)lockNow()});
$('#lk').onclick=lockNow;
lockInit();
</script>
</body>
